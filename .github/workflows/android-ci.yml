name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-quality:
    name: Logic tests and 80% coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Verify debug logic coverage
        run: ./gradlew :app:logicDebugUnitTestCoverageVerification --no-daemon
