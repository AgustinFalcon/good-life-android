name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-quality:
    name: Logic tests and 80% coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Verify debug logic coverage
        run: ./gradlew :app:logicDebugUnitTestCoverageVerification --no-daemon

      - name: Verify agent, documentation, changelog, and secret governance
        shell: bash
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/verify-governance.sh
  release-static:
    name: Unsigned release lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Verify unsigned release lint and assembly
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon