name: Android CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-quality:
    name: Logic tests and 80% coverage
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Verify debug logic coverage
        run: ./gradlew :app:logicDebugUnitTestCoverageVerification --no-daemon

      - name: Verify agent, documentation, changelog, and secret governance
        shell: bash
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/verify-governance.sh
  release-static:
    name: Lint baseline and unsigned release build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Generate debug and release lint reports
        run: ./gradlew :app:lintDebug :app:lintRelease --no-daemon

      - name: Verify resource inventory derivation
        run: python3 .github/scripts/resource_inventory.py --baseline config/lint-baseline.json --output-json sdd/features/20260915-goodlife-unused-resources/4-implementation/resource-inventory.json --markdown sdd/features/20260915-goodlife-unused-resources/4-implementation/resource-inventory.md --check

      - name: Test resource inventory checker
        run: python3 .github/tests/test_resource_inventory.py

      - name: Test fail-closed baseline reducer
        run: python3 .github/tests/test_remove_lint_baseline_entries.py

      - name: Verify exact lint debt inventory
        run: python3 .github/scripts/verify_lint_baseline.py --baseline config/lint-baseline.json --debug-report app/build/reports/lint-results-debug.xml --release-report app/build/reports/lint-results-release.xml --repo-root "$GITHUB_WORKSPACE" --advisory-delta-out build/lint-advisory-delta.json

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lint-evidence
          if-no-files-found: error
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-release.xml
            build/lint-advisory-delta.json
      - name: Verify unsigned release assembly
        run: ./gradlew :app:assembleRelease --no-daemon
