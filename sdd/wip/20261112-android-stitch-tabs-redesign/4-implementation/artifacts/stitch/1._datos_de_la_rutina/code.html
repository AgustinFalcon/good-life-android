<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2ECC71",
                        "background-light": "#f8fdfa",
                        "background-dark": "#0d1410",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Nueva Rutina - Paso 1</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-lg mx-auto min-h-screen flex flex-col pb-24">
<!-- TopAppBar Component -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 pt-4 pb-2">
<div class="flex items-center justify-between mb-4">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 px-4">Nueva rutina</h2>
<div class="flex items-center justify-end">
<span class="bg-primary/10 text-primary text-[10px] font-bold leading-none tracking-widest px-2 py-1 rounded uppercase">Rutina</span>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-600 dark:text-slate-400 text-sm font-medium">Paso 1 de 7</p>
<p class="text-primary text-xs font-bold">14%</p>
</div>
<div class="rounded-full bg-primary/10 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 14%;"></div>
</div>
</div>
</header>
<main class="flex flex-col gap-6 p-4">
<!-- Basic Info Section -->
<section class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<span class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Nombre de la rutina</span>
<input class="w-full rounded-2xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-14 px-4 text-base transition-colors" placeholder="Ej. Empuje Hipertrofia" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Descripción (Opcional)</span>
<textarea class="w-full rounded-2xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary min-h-24 p-4 text-base transition-colors" placeholder="Escribe detalles sobre tu rutina..."></textarea>
</label>
</section>
<!-- Difficulty Chips -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Dificultad</h3>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary bg-primary/10 text-primary text-sm font-medium">Principiante</button>
<button class="px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-medium hover:border-primary/50">Intermedio</button>
<button class="px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-medium hover:border-primary/50">Avanzado</button>
</div>
</section>
<!-- Objective Selector -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Objetivo principal</h3>
<div class="relative">
<select class="w-full rounded-2xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-14 pl-12 pr-4 appearance-none">
<option value="">Selecciona un objetivo</option>
<option value="muscle">Ganar músculo</option>
<option value="weight">Perder peso</option>
<option value="strength">Fuerza máxima</option>
<option value="endurance">Resistencia</option>
<option value="flex">Flexibilidad</option>
<option value="health">Salud general</option>
</select>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none">
<span class="material-symbols-outlined">fitness_center</span>
</div>
</div>
</section>
<!-- Days of Week -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Días de entrenamiento</h3>
<div class="flex justify-between items-center gap-1">
<button class="size-10 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center">L</button>
<button class="size-10 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 text-xs font-bold flex items-center justify-center">M</button>
<button class="size-10 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center">X</button>
<button class="size-10 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 text-xs font-bold flex items-center justify-center">J</button>
<button class="size-10 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center">V</button>
<button class="size-10 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 text-xs font-bold flex items-center justify-center">S</button>
<button class="size-10 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 text-xs font-bold flex items-center justify-center">D</button>
</div>
</section>
<!-- Time and Dates -->
<section class="bg-white dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col gap-5">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">schedule</span>
<span class="text-sm font-medium">Recordatorio de hora</span>
</div>
<div class="w-12 h-6 bg-primary rounded-full relative">
<div class="absolute right-1 top-1 size-4 bg-white rounded-full"></div>
</div>
</div>
<div class="flex gap-4">
<div class="flex-1 flex flex-col gap-1">
<span class="text-[10px] uppercase font-bold text-slate-400 px-1">Hora</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-semibold h-10 px-3 focus:ring-1 focus:ring-primary" type="time" value="08:00"/>
</div>
<div class="flex-1 flex flex-col gap-1">
<span class="text-[10px] uppercase font-bold text-slate-400 px-1">Fecha inicio</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-semibold h-10 px-3 focus:ring-1 focus:ring-primary" type="date" value="2023-10-27"/>
</div>
</div>
<div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">event_busy</span>
<span class="text-sm font-medium">Establecer fecha fin</span>
</div>
<div class="w-12 h-6 bg-slate-200 dark:bg-slate-700 rounded-full relative">
<div class="absolute left-1 top-1 size-4 bg-white rounded-full"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Action -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex justify-center max-w-lg mx-auto w-full z-20">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                Siguiente
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
</div>
</body></html>
