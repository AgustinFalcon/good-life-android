<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Task Status Detail</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e86e",
                        "primary-dark": "#28c45d", 
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "neutral-surface": "#eef2ee", 
                        "neutral-surface-dark": "#1a2e21", 
                        // Pastel variants for cards
                        "pastel-blue": "#E3F2FD",
                        "pastel-blue-deep": "#BBDEFB",
                        "pastel-green": "#E8F5E9",
                        "pastel-red": "#FFEBEE",
                        "pastel-orange": "#FFF3E0",
                        // Dark mode pastel variants
                        "pastel-blue-dark": "#1E2A36",
                        "pastel-green-dark": "#1E3324",
                        "pastel-red-dark": "#382022",
                        "pastel-orange-dark": "#38291C",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'bounce-slight': 'bounce-slight 2s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'bounce-slight': {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #30e86e;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(48,232,110,0.5);
            border: 2px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #4b5563;
        }
        .dark input[type=range]::-webkit-slider-thumb {
            border-color: #1a2e21;
        }.confetti-bg {
            background-image: radial-gradient(#30e86e 2px, transparent 2px), radial-gradient(#60a5fa 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.1;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 font-display min-h-screen flex justify-center">
<div class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
<div class="absolute top-0 left-0 w-full h-[40%] bg-gradient-to-b from-pastel-blue via-pastel-blue/50 to-transparent dark:from-pastel-blue-dark dark:via-pastel-blue-dark/50 pointer-events-none z-0"></div>
<div class="absolute inset-0 confetti-bg pointer-events-none z-0"></div>
<header class="px-6 pt-12 pb-4 flex justify-between items-center z-10 relative">
<button class="w-10 h-10 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm hover:bg-gray-50 dark:hover:bg-white/20 transition-colors">
<span class="material-icons-round text-gray-600 dark:text-gray-300">arrow_back</span>
</button>
<span class="text-sm font-bold tracking-widest uppercase text-blue-800 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/30 px-3 py-1 rounded-full">Task Details</span>
<button class="w-10 h-10 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm hover:bg-gray-50 dark:hover:bg-white/20 transition-colors">
<span class="material-icons-round text-gray-600 dark:text-gray-300">more_horiz</span>
</button>
</header>
<main class="flex-1 px-6 pt-4 pb-24 z-10 overflow-y-auto no-scrollbar">
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-pastel-blue-deep/30 dark:bg-blue-900/30 mb-4 animate-bounce-slight text-blue-600 dark:text-blue-400">
<span class="material-icons-round text-4xl">edit_document</span>
</div>
<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 leading-tight">Project Review</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Submit final slides to team</p>
</div>
<div class="bg-white dark:bg-neutral-surface-dark rounded-[2rem] p-6 shadow-xl shadow-blue-100/50 dark:shadow-none mb-6 relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="flex items-center justify-between relative z-10">
<div>
<h3 class="text-lg font-bold text-gray-800 dark:text-gray-100">Status</h3>
<p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Mark as completed</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-16 h-9 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-7 after:w-7 after:transition-all dark:border-gray-600 peer-checked:bg-primary shadow-inner"></div>
<span class="absolute right-2.5 text-white text-[10px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity">ON</span>
</label>
</div>
</div>
<div class="bg-white dark:bg-neutral-surface-dark rounded-[2rem] p-6 shadow-sm mb-6">
<div class="flex justify-between items-center mb-6">
<div class="flex items-center gap-2">
<span class="material-icons-round text-orange-400">timer</span>
<h3 class="text-lg font-bold text-gray-800 dark:text-gray-100">Time Spent</h3>
</div>
<div class="bg-orange-50 dark:bg-orange-900/20 px-3 py-1 rounded-lg">
<span class="text-xl font-extrabold text-orange-600 dark:text-orange-400">45</span>
<span class="text-xs font-semibold text-orange-400 ml-1">min</span>
</div>
</div>
<div class="relative pt-2 pb-2">
<input class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700" max="120" min="0" type="range" value="45"/>
<div class="flex justify-between text-xs text-gray-400 mt-2 font-medium">
<span>0m</span>
<span>30m</span>
<span>1h</span>
<span>2h</span>
</div>
</div>
</div>
<div class="bg-white dark:bg-neutral-surface-dark rounded-[2rem] p-6 shadow-sm">
<div class="flex items-center gap-2 mb-4">
<span class="material-icons-round text-blue-400">notes</span>
<h3 class="text-lg font-bold text-gray-800 dark:text-gray-100">Notes</h3>
</div>
<textarea class="w-full bg-background-light dark:bg-background-dark border-0 rounded-xl p-4 text-gray-700 dark:text-gray-300 text-sm focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-900 resize-none h-32 placeholder-gray-400" placeholder="Add any thoughts or reflections about this task..."></textarea>
</div>
</main>
<div class="absolute bottom-0 w-full bg-white/90 dark:bg-neutral-surface-dark/95 backdrop-blur-xl border-t border-gray-100 dark:border-gray-800 p-6 z-40">
<button class="w-full py-4 bg-primary hover:bg-primary-dark text-black font-bold rounded-2xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
<span class="material-icons-round group-hover:animate-bounce">check_circle</span>
<span>Save Changes</span>
</button>
</div>
</div>

</body></html>
