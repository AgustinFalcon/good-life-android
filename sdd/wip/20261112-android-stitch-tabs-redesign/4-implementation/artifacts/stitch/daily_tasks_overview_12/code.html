<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Habit Progress Detail</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e86e",
                        "primary-dark": "#28c45d", 
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "neutral-surface": "#eef2ee",
                        "neutral-surface-dark": "#1a2e21",
                        "pastel-green": "#E8F5E9",
                        "pastel-green-dark": "#1E3324",
                        "water-blue": "#4FC3F7",
                        "water-blue-dark": "#0288D1",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }.progress-ring__circle {
        transition: stroke-dashoffset 0.35s;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 font-display min-h-screen flex justify-center">
<div class="w-full max-w-md bg-pastel-green dark:bg-pastel-green-dark min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
<header class="pt-12 px-6 pb-4 z-10 sticky top-0 flex items-center justify-between">
<button class="w-10 h-10 rounded-full bg-white/60 dark:bg-black/20 flex items-center justify-center hover:bg-white/80 transition-colors text-green-900 dark:text-green-100">
<span class="material-icons-round">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-green-900 dark:text-green-100 uppercase tracking-widest">Habit Detail</h1>
<button class="w-10 h-10 rounded-full bg-white/60 dark:bg-black/20 flex items-center justify-center hover:bg-white/80 transition-colors text-green-900 dark:text-green-100">
<span class="material-icons-round">more_vert</span>
</button>
</header>
<main class="flex-1 px-6 pb-24 flex flex-col items-center justify-start pt-6 space-y-8">
<div class="text-center">
<h2 class="text-3xl font-extrabold text-green-900 dark:text-green-50 mb-1">Drink Water</h2>
<p class="text-green-700 dark:text-green-300 font-medium opacity-80">Stay hydrated today</p>
</div>
<div class="relative w-64 h-64 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90 drop-shadow-xl" viewBox="0 0 120 120">
<circle class="text-green-200 dark:text-green-900/40" cx="60" cy="60" fill="transparent" r="52" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-water-blue progress-ring__circle" cx="60" cy="60" fill="transparent" r="52" stroke="currentColor" stroke-dasharray="326.72" stroke-dashoffset="120" stroke-linecap="round" stroke-width="8"></circle> 
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="relative w-24 h-32 mb-2">
<div class="w-20 h-28 mx-auto bg-white/30 dark:bg-white/10 border-4 border-white dark:border-white/20 rounded-b-3xl rounded-t-lg relative overflow-hidden backdrop-blur-sm">
<div class="absolute bottom-0 w-full bg-water-blue/80 h-[65%] transition-all duration-500 flex items-start justify-center pt-2">
<div class="w-2 h-2 rounded-full bg-white/40 absolute bottom-4 left-4 animate-bounce"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/40 absolute bottom-8 right-6 animate-bounce" style="animation-delay: 0.5s"></div>
</div>
<div class="absolute top-2 right-2 w-1.5 h-12 bg-white/30 rounded-full"></div>
</div>
</div>
<div class="text-center mt-2">
<span class="text-3xl font-bold text-gray-800 dark:text-white">1250</span>
<span class="text-sm font-semibold text-gray-500 dark:text-gray-400">/ 2000 ml</span>
</div>
</div>
</div>
<div class="w-full max-w-xs space-y-6">
<div class="flex items-center justify-between bg-white/50 dark:bg-black/20 p-2 rounded-2xl backdrop-blur-sm shadow-sm">
<button class="w-12 h-12 rounded-xl bg-white dark:bg-green-900 text-green-700 dark:text-green-300 shadow-sm flex items-center justify-center hover:bg-green-50 active:scale-95 transition-all">
<span class="material-icons-round">remove</span>
</button>
<div class="flex flex-col items-center">
<span class="text-xs font-bold text-green-800 dark:text-green-200 tracking-wider uppercase">Amount</span>
<span class="text-xl font-bold text-gray-900 dark:text-white">+250 ml</span>
</div>
<button class="w-12 h-12 rounded-xl bg-primary text-black shadow-md shadow-primary/30 flex items-center justify-center hover:bg-primary-dark active:scale-95 transition-all">
<span class="material-icons-round">add</span>
</button>
</div>
<div class="flex justify-center gap-3">
<button class="px-3 py-1.5 rounded-lg bg-white/40 dark:bg-black/20 text-xs font-semibold text-green-900 dark:text-green-100 hover:bg-white/60 transition-colors">
                    +100ml
                </button>
<button class="px-3 py-1.5 rounded-lg bg-white/40 dark:bg-black/20 text-xs font-semibold text-green-900 dark:text-green-100 hover:bg-white/60 transition-colors">
                    +500ml
                </button>
</div>
</div>
</main>
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-pastel-green via-pastel-green to-transparent dark:from-pastel-green-dark dark:via-pastel-green-dark pt-12">
<button class="w-full py-4 bg-gray-900 dark:bg-white text-white dark:text-black rounded-2xl font-bold text-lg shadow-xl shadow-green-900/10 hover:shadow-2xl hover:-translate-y-1 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-icons-round">save</span>
            Save Progress
        </button>
</div>
</div>

</body></html>
