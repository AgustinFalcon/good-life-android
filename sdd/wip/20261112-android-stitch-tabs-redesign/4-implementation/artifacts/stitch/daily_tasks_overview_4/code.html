<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meal Completion Detail</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e86e",
                        "primary-dark": "#28c45d", 
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "neutral-surface": "#eef2ee", 
                        "neutral-surface-dark": "#1a2e21", 
                        // Pastel variants for cards
                        "pastel-blue": "#E3F2FD",
                        "pastel-green": "#E8F5E9",
                        "pastel-red": "#FFEBEE",
                        "pastel-orange": "#FFF3E0",
                        // Dark mode pastel variants
                        "pastel-blue-dark": "#1E2A36",
                        "pastel-green-dark": "#1E3324",
                        "pastel-red-dark": "#382022",
                        "pastel-orange-dark": "#38291C",
                        "meal-accent": "#FFA726", // Specific accent for meal interactions
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #FFA726;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #4b5563;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 font-display min-h-screen flex justify-center">
<div class="w-full max-w-md bg-pastel-orange dark:bg-pastel-orange-dark min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
<div class="relative h-72 w-full">
<button class="absolute top-12 left-6 z-20 w-10 h-10 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/50 transition-colors">
<span class="material-icons-round">arrow_back</span>
</button>
<img alt="Oatmeal and berries" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9YdRb8lCrCEytRtWp5k9lhGhf-Gu2ymxq-PHANxpiQC57AKSlU_3FuF-pZVnpiKSwuxHaaNcjxqbuBzC3M_7FhAQVigqK5CXJnwhfBhK9Kj82qUBJjOyhUF5_EheLpefsNenzNBJBcZ30SapOdLP6VRgAxD5H1F_wVEQtv1HkTmh_5w93KlGreWyogWcGHObPILpjzQbMTYt6Cg4kcQ2589qmJE1QLEBy0c6mqEM4RLj0nM6LIVcXyKto2ai8ChRMiXUwetEEPxk"/>
<div class="absolute inset-0 bg-gradient-to-t from-pastel-orange via-transparent to-black/30 dark:from-pastel-orange-dark"></div>
<div class="absolute bottom-6 left-6 right-6 z-10">
<span class="inline-block px-3 py-1 bg-orange-500 text-white rounded-full text-xs font-bold tracking-widest mb-2 shadow-sm">BREAKFAST</span>
<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white leading-tight">Oatmeal &amp; Berries</h1>
</div>
</div>
<main class="flex-1 px-6 pt-4 pb-24 -mt-4 bg-background-light dark:bg-background-dark rounded-t-[2.5rem] relative z-10 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] flex flex-col gap-6">
<div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-2 mt-4 opacity-50"></div>
<div class="bg-white dark:bg-neutral-surface-dark p-6 rounded-[2rem] shadow-sm border border-orange-100 dark:border-orange-900/30">
<div class="flex justify-between items-center mb-6">
<h2 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2">
<span class="material-icons-round text-orange-400">scale</span>
                    Portion
                </h2>
<div class="text-2xl font-extrabold text-orange-500">200<span class="text-sm text-gray-500 font-medium ml-1">g</span></div>
</div>
<div class="mb-8 px-2">
<input class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700 accent-orange-500" max="500" min="50" type="range" value="200"/>
<div class="flex justify-between mt-2 text-xs text-gray-400 font-semibold uppercase tracking-wider">
<span>50g</span>
<span>500g</span>
</div>
</div>
<div class="flex items-center justify-between bg-background-light dark:bg-black/20 rounded-2xl p-2 mb-8">
<button class="w-12 h-12 flex items-center justify-center rounded-xl bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 shadow-sm hover:bg-orange-50 dark:hover:bg-gray-600 transition-colors">
<span class="material-icons-round">remove</span>
</button>
<div class="text-sm font-medium text-gray-500 dark:text-gray-400">Adjust amount</div>
<button class="w-12 h-12 flex items-center justify-center rounded-xl bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 shadow-sm hover:bg-orange-50 dark:hover:bg-gray-600 transition-colors">
<span class="material-icons-round">add</span>
</button>
</div>
<div class="grid grid-cols-4 gap-2 text-center">
<div class="flex flex-col items-center p-3 bg-orange-50 dark:bg-orange-900/20 rounded-2xl border border-orange-100 dark:border-orange-900/30">
<span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Cals</span>
<span class="text-lg font-black text-gray-800 dark:text-white">320</span>
</div>
<div class="flex flex-col items-center p-3 bg-blue-50 dark:bg-blue-900/20 rounded-2xl border border-blue-100 dark:border-blue-900/30">
<span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Prot</span>
<span class="text-lg font-black text-gray-800 dark:text-white">12g</span>
</div>
<div class="flex flex-col items-center p-3 bg-green-50 dark:bg-green-900/20 rounded-2xl border border-green-100 dark:border-green-900/30">
<span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Carb</span>
<span class="text-lg font-black text-gray-800 dark:text-white">45g</span>
</div>
<div class="flex flex-col items-center p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-2xl border border-yellow-100 dark:border-yellow-900/30">
<span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Fat</span>
<span class="text-lg font-black text-gray-800 dark:text-white">6g</span>
</div>
</div>
</div>
<div class="flex-1">
<label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3 ml-1" for="notes">
                Notes <span class="text-gray-400 font-normal text-xs">(Optional)</span>
</label>
<div class="relative">
<textarea class="w-full bg-white dark:bg-neutral-surface-dark border-0 rounded-2xl p-4 text-gray-800 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-orange-400 resize-none shadow-sm" id="notes" placeholder="Added extra blueberries..." rows="3"></textarea>
<span class="absolute bottom-3 right-4 text-gray-400 pointer-events-none material-icons-round text-sm">edit</span>
</div>
</div>
</main>
<div class="absolute bottom-0 left-0 right-0 p-6 bg-white dark:bg-background-dark/95 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800 z-50">
<div class="flex items-center gap-4">
<div class="flex flex-col">
<span class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Total</span>
<span class="text-xl font-extrabold text-gray-900 dark:text-white">320 kcal</span>
</div>
<button class="flex-1 h-14 bg-gray-900 dark:bg-primary text-white dark:text-black font-bold text-lg rounded-2xl shadow-lg shadow-gray-300 dark:shadow-primary/30 flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95 transition-all">
<span class="material-icons-round">check_circle</span>
                Complete Meal
            </button>
</div>
</div>
</div>

</body></html>
