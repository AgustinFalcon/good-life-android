<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crear Tarea - Una Vez</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-teal": "#003C3C",
                        "accent-green": "#1EC691",
                        "task-blue-bg": "#E3F2FD",
                        "task-blue-text": "#1976D2",
                        "neutral-surface": "#F8FAF8",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "ios": "1.25rem",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-gray-900 font-display;
            }
        }
        .bottom-sheet-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(248,250,248,1) 100%);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #003C3C 0%, #1EC691 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center items-end min-h-screen">
<div class="w-full max-w-md bg-white rounded-t-[2.5rem] shadow-2xl overflow-hidden flex flex-col relative animate-slide-up">
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-gray-200 rounded-full"></div>
</div>
<header class="px-6 py-4 flex flex-col items-center">
<div class="bg-task-blue-bg px-4 py-1.5 rounded-full mb-4">
<span class="text-task-blue-text font-extrabold text-[10px] tracking-widest uppercase">Tarea</span>
</div>
<h1 class="text-2xl font-extrabold text-gray-900">Nueva Tarea</h1>
</header>
<main class="px-6 pb-10 space-y-6">
<div class="bg-gray-100 p-1 rounded-2xl flex">
<button class="flex-1 py-2.5 bg-white rounded-xl shadow-sm text-sm font-bold text-gray-900 transition-all">
                    Una vez
                </button>
<button class="flex-1 py-2.5 text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all">
                    Hábito
                </button>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Título</label>
<input class="w-full px-5 py-4 bg-neutral-surface border-none rounded-ios focus:ring-2 focus:ring-accent-green/30 text-gray-900 font-semibold placeholder:text-gray-300 transition-all" placeholder="Comprar verduras" type="text"/>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Descripción</label>
<textarea class="w-full px-5 py-4 bg-neutral-surface border-none rounded-ios focus:ring-2 focus:ring-accent-green/30 text-gray-900 font-medium placeholder:text-gray-300 transition-all resize-none" placeholder="Añade una nota..." rows="3"></textarea>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">¿Cuándo?</label>
<button class="w-full flex items-center justify-between px-5 py-4 bg-neutral-surface rounded-ios hover:bg-gray-100 transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-accent-green/10 flex items-center justify-center text-accent-green">
<span class="material-icons-round">calendar_today</span>
</div>
<span class="font-bold text-gray-800">Mié, 04 de marzo de 2026</span>
</div>
<span class="material-icons-round text-gray-300 group-hover:text-gray-500 transition-colors">chevron_right</span>
</button>
</div>
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-2">
<span class="material-icons-round text-gray-400 text-xl">notifications_active</span>
<span class="text-sm font-bold text-gray-700">Recordatorio</span>
</div>
<div class="w-12 h-7 bg-accent-green rounded-full flex items-center justify-end px-1">
<div class="w-5 h-5 bg-white rounded-full shadow-sm"></div>
</div>
</div>
<div class="pt-4">
<button class="w-full btn-gradient py-5 rounded-ios text-white font-extrabold text-sm tracking-widest shadow-xl shadow-accent-green/20 active:scale-[0.98] transition-all uppercase">
                    Guardar Tarea
                </button>
</div>
</main>
<div class="h-8"></div>
</div>
<div class="fixed inset-0 -z-10 bg-black/40 backdrop-blur-sm"></div>

</body></html>
