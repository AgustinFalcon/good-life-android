<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill-icon { font-variation-settings: 'FILL' 1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen shadow-xl overflow-x-hidden">
<!-- Header / Hero Section -->
<div class="relative h-80 w-full overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Plate of grilled salmon with green asparagus and lemon slices" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBcS3qDQIv01D4myt1_NOEiLkqacpVn8oS6zWupbGTK5-WUR2DZSP4KUt3gBOZZHlJBj-s15jBUMGstno2g8FnSNC5a6Em_mBUkCvsihzL8XdX2wx6J8Pkh7U7kizGmS58lR8P0Ie7aVHBKXiq3HyJ9eOkv1W1kS3C2CKFX5-hCq0qVVQmFL_P7yf0XQZmbQN725N4Jc61fDLHJATLWXtm6uQzZ-cToUtQTVC6MaQEolxREM2kLqrB066HY6NrkUoxNSbMZAjNkHMc');">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
</div>
<!-- Top App Bar Overlay -->
<div class="absolute top-0 left-0 right-0 flex items-center justify-between p-4 z-10">
<button class="bg-white/90 dark:bg-slate-800/90 p-2 rounded-full shadow-lg backdrop-blur-sm">
<span class="material-symbols-outlined block text-slate-900 dark:text-white">arrow_back</span>
</button>
<button class="bg-white/90 dark:bg-slate-800/90 p-2 rounded-full shadow-lg backdrop-blur-sm">
<span class="material-symbols-outlined block text-primary">favorite</span>
</button>
</div>
</div>
<!-- Main Content Section -->
<div class="relative -mt-8 bg-white dark:bg-slate-900 rounded-t-2xl p-6 shadow-2xl">
<!-- Title and Calories -->
<div class="flex flex-col gap-1 mb-6">
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Salmón con Espárragos Grillados</h1>
<div class="flex items-center gap-2 mt-2">
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-sm font-bold">420 kcal</span>
</div>
</div>
<!-- Macros Section -->
<div class="grid grid-cols-1 gap-4 mb-8">
<!-- Protein -->
<div class="flex flex-col gap-1">
<div class="flex justify-between text-sm font-medium">
<span class="text-slate-600 dark:text-slate-400">Proteína</span>
<span class="text-blue-600 font-bold">35g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
<div class="bg-blue-500 h-full rounded-full" style="width: 70%"></div>
</div>
</div>
<!-- Carbs -->
<div class="flex flex-col gap-1">
<div class="flex justify-between text-sm font-medium">
<span class="text-slate-600 dark:text-slate-400">Carbohidratos</span>
<span class="text-green-600 font-bold">10g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
<div class="bg-green-500 h-full rounded-full" style="width: 20%"></div>
</div>
</div>
<!-- Fat -->
<div class="flex flex-col gap-1">
<div class="flex justify-between text-sm font-medium">
<span class="text-slate-600 dark:text-slate-400">Grasas</span>
<span class="text-yellow-600 font-bold">28g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
<div class="bg-yellow-500 h-full rounded-full" style="width: 55%"></div>
</div>
</div>
</div>
<!-- Info Row -->
<div class="flex justify-between items-center py-4 border-y border-slate-100 dark:border-slate-800 mb-8">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary">schedule</span>
<span class="text-xs font-medium text-slate-500">25 min</span>
</div>
<div class="h-8 w-px bg-slate-100 dark:bg-slate-800"></div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary">restaurant</span>
<span class="text-xs font-medium text-slate-500">1 Porción</span>
</div>
<div class="h-8 w-px bg-slate-100 dark:bg-slate-800"></div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary">equalizer</span>
<span class="text-xs font-medium text-slate-500">Medio</span>
</div>
</div>
<!-- Ingredients Section -->
<div class="mb-24">
<div class="flex justify-between items-center mb-4">
<h2 class="text-xl font-bold text-slate-900 dark:text-slate-100">Ingredientes</h2>
<span class="text-primary text-sm font-semibold">3 items</span>
</div>
<div class="flex flex-col gap-3">
<!-- Ingredient Card: Salmon -->
<div class="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
<div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-200">
<img class="w-full h-full object-cover" data-alt="Raw salmon fillet on a wooden board" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCLSFg1cPObcTqLp3Wa1PUA-OvPhS7qTizMFNUyWKjJDUeRAn3hEwgYGZGaJZs9rE4d4NyxsJipeHwCdu8_6xg9SMXqoVbQlXbyMhs_EtnpfnahkR41YOMMQ_uyR0dx9T9t4-Zlnjhnke_xaLBW3ohA9JcHaUnTuFtxUJNm2rFpCRuN1GD9NnLQYqW0HsrPImjXWakF7kFzeti6d_chaCwvIem5ZF6HPZitP9zqbJH9olA7hBRJOS3O9Y48rwUDobMuhqMGjoIWQ8"/>
</div>
<div class="flex-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Salmón Fresco</p>
<p class="text-xs text-slate-500 dark:text-slate-400">200g • 320 kcal</p>
</div>
<div class="text-right">
<span class="text-sm font-bold text-blue-600">30g Prot.</span>
</div>
</div>
<!-- Ingredient Card: Asparagus -->
<div class="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
<div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-200">
<img class="w-full h-full object-cover" data-alt="Bundle of green asparagus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzUa1sWJHtW6w9wIV47WTUscm7tw8ugf4YO9nAc5fqTFzz1ujrl-KjSaWRvlbbWIFX7jEYU3plXxjGPBHbmuU5l1SLmMcHqJxRF7Xse0g58Zm22fGCD9iP6IchvHrj54m6Q_Ia1uCvzjdNoI07txQJhNgUkvyszcinc7Sy9_ZhShRWOo4zLW_5dUEfuCZdk_cXIO3NRJg05Z5Ds6ePJGMZy8syd57ZWQAXjgzog3GfmY6VHIfYBshJnw1Kxb9Fj8NXEgkKIOZUbMw"/>
</div>
<div class="flex-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Espárragos</p>
<p class="text-xs text-slate-500 dark:text-slate-400">150g • 30 kcal</p>
</div>
<div class="text-right">
<span class="text-sm font-bold text-blue-600">3g Prot.</span>
</div>
</div>
<!-- Ingredient Card: Olive Oil -->
<div class="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
<div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-200">
<img class="w-full h-full object-cover" data-alt="Olive oil pouring into a bowl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwLMukyK8QE88jGTx4bZwCRLqYQYe9dq5Ds5KGRY5qGQ9WYa_X7eL5BnOeDrC6kt7GcEarn63egOP9VocOMjqkV7sUoIqsvND5At2T3i7dtoc55UMNkCi4Br9f0WRdh01bNvErKP8X6SVuJdP593YQPz5tE4_nM5-4lpnS2RehY2-LK25nrXuO1r7n6LwNFNrKP7md4kFCUMKdGA55rqDf5ozTIqqyOFg1Ly4NNEjoKL6eJn0i4jTRfNGAz7b9XY2peBTIjGfWrWs"/>
</div>
<div class="flex-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Aceite de Oliva</p>
<p class="text-xs text-slate-500 dark:text-slate-400">1 cda • 70 kcal</p>
</div>
<div class="text-right">
<span class="text-sm font-bold text-blue-600">0g Prot.</span>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Buttons -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md p-6 bg-gradient-to-t from-white via-white dark:from-slate-900 dark:via-slate-900 to-transparent pt-10">
<div class="flex flex-col gap-3">
<button class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined fill-icon">add_circle</span>
                    Añadir al Plan
                </button>
<button class="w-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold py-4 rounded-2xl border border-slate-200 dark:border-slate-700 active:scale-[0.98] transition-transform">
                    Personalizar
                </button>
</div>
</div>
</div>
</body></html>
