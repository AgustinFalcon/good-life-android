<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoodLife - Nueva Comida</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#F57C00', // GoodLife Orange
            protein: '#2196F3',
            carbs: '#FFC107',
            fats: '#9C27B0'
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="sticky top-0 bg-white z-10 border-b border-gray-100 px-4 pt-4 pb-2">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-3">
<!-- Back Button Placeholder Icon -->
<button aria-label="Volver" class="p-1 -ml-1">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<h1 class="text-xl font-bold">Nueva Comida</h1>
</div>
<span class="bg-brand/10 text-brand text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
        Comida
      </span>
</div>
<!-- Progress Section -->
<div class="mt-4 mb-2">
<div class="flex justify-between items-end mb-1.5">
<span class="text-sm font-medium text-gray-500">Paso 1 de 3</span>
<span class="text-sm font-bold text-brand">33%</span>
</div>
<div class="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
<div class="bg-brand h-full rounded-full transition-all duration-300" style="width: 33.33%"></div>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- BEGIN: SearchAndFilters -->
<section class="px-4 mt-4 space-y-4">
<!-- Search Bar -->
<div class="relative">
<span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand focus:bg-white transition-all text-sm" placeholder="Buscar comida..." type="text"/>
</div>
<!-- Horizontal Filter Chips -->
<div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-brand text-white text-sm font-medium shadow-sm">Todos</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-gray-100 text-gray-600 text-sm font-medium">Desayuno</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-gray-100 text-gray-600 text-sm font-medium">Almuerzo</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-gray-100 text-gray-600 text-sm font-medium">Cena</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-gray-100 text-gray-600 text-sm font-medium">Snack</button>
</div>
</section>
<!-- END: SearchAndFilters -->
<!-- BEGIN: MealList -->
<section class="px-4 mt-6 space-y-3">
<!-- Meal Card 1 -->
<div class="flex items-center p-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
<div class="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-2xl mr-4" data-purpose="food-icon">
          🥗
        </div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-gray-900 truncate">Ensalada César Pollo</h3>
<div class="flex items-center gap-2 mt-1 flex-wrap text-xs font-semibold">
<span class="text-brand">350 kcal</span>
<span class="text-gray-300">•</span>
<span class="text-protein">P: 28g</span>
<span class="text-carbs">C: 12g</span>
<span class="text-fats">G: 22g</span>
</div>
</div>
<button class="ml-2 px-4 py-1.5 border border-brand text-brand text-sm font-bold rounded-lg hover:bg-brand hover:text-white transition-colors">
          Elegir
        </button>
</div>
<!-- Meal Card 2 -->
<div class="flex items-center p-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
<div class="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-2xl mr-4" data-purpose="food-icon">
          🍝
        </div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-gray-900 truncate">Pasta Boloñesa Fit</h3>
<div class="flex items-center gap-2 mt-1 flex-wrap text-xs font-semibold">
<span class="text-brand">480 kcal</span>
<span class="text-gray-300">•</span>
<span class="text-protein">P: 32g</span>
<span class="text-carbs">C: 55g</span>
<span class="text-fats">G: 14g</span>
</div>
</div>
<button class="ml-2 px-4 py-1.5 border border-brand text-brand text-sm font-bold rounded-lg hover:bg-brand hover:text-white transition-colors">
          Elegir
        </button>
</div>
<!-- Meal Card 3 -->
<div class="flex items-center p-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
<div class="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-2xl mr-4" data-purpose="food-icon">
          🥑
        </div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-gray-900 truncate">Tostada con Aguacate</h3>
<div class="flex items-center gap-2 mt-1 flex-wrap text-xs font-semibold">
<span class="text-brand">310 kcal</span>
<span class="text-gray-300">•</span>
<span class="text-protein">P: 9g</span>
<span class="text-carbs">C: 24g</span>
<span class="text-fats">G: 18g</span>
</div>
</div>
<button class="ml-2 px-4 py-1.5 border border-brand text-brand text-sm font-bold rounded-lg hover:bg-brand hover:text-white transition-colors">
          Elegir
        </button>
</div>
<!-- Meal Card 4 -->
<div class="flex items-center p-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
<div class="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-2xl mr-4" data-purpose="food-icon">
          🥣
        </div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-gray-900 truncate">Avena con Arándanos</h3>
<div class="flex items-center gap-2 mt-1 flex-wrap text-xs font-semibold">
<span class="text-brand">280 kcal</span>
<span class="text-gray-300">•</span>
<span class="text-protein">P: 12g</span>
<span class="text-carbs">C: 45g</span>
<span class="text-fats">G: 6g</span>
</div>
</div>
<button class="ml-2 px-4 py-1.5 border border-brand text-brand text-sm font-bold rounded-lg hover:bg-brand hover:text-white transition-colors">
          Elegir
        </button>
</div>
</section>
<!-- END: MealList -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomActions -->
<div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-gray-100 p-4">
<button class="w-full flex items-center justify-center gap-2 py-4 border-2 border-brand border-dashed text-brand font-bold rounded-2xl hover:bg-orange-50 transition-colors">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
      Crear nueva comida
    </button>
</div>
<!-- END: BottomActions -->
</body></html>
