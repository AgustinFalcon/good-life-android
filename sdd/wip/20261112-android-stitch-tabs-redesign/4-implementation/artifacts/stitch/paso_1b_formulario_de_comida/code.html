<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoodLife - Nueva Comida</title>
<!-- BEGIN: External Resources -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- END: External Resources -->
<!-- BEGIN: Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#F57C00',
              lightOrange: '#FFF3E0',
            }
          },
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- END: Tailwind Configuration -->
<style data-purpose="custom-layout-styles">
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Custom height for mobile viewport simulation */
    body {
      background-color: #F9FAFB;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    
    .mobile-container {
      width: 100%;
      max-width: 430px; /* iPhone 14/15 Pro Max width */
      height: 100vh;
      background-color: white;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="antialiased text-slate-800">
<div class="mobile-container overflow-hidden">
<!-- BEGIN: MainHeader -->
<header class="p-6 pb-2" data-purpose="screen-header">
<div class="flex justify-between items-center mb-4">
<!-- Back button simulation -->
<button class="text-slate-600">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="bg-brand-orange text-white text-[10px] font-bold px-2 py-0.5 rounded-full tracking-wider">COMIDA</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 mb-6">Nueva Comida</h1>
<!-- Progress Section -->
<div class="space-y-2" data-purpose="step-indicator">
<div class="flex justify-between items-end">
<span class="text-sm font-medium text-slate-500">Paso 1 de 3</span>
<span class="text-sm font-bold text-brand-orange">33%</span>
</div>
<div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
<div class="bg-brand-orange h-full rounded-full" style="width: 33%"></div>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: FormContent -->
<main class="flex-1 overflow-y-auto p-6 space-y-8 no-scrollbar">
<!-- Basic Information Section -->
<section class="space-y-6" data-purpose="basic-info-fields">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700" for="meal-name">Nombre de la comida *</label>
<input class="w-full border-slate-200 rounded-xl p-4 focus:ring-brand-orange focus:border-brand-orange transition-all placeholder:text-slate-400" id="meal-name" placeholder="Ej. Ensalada César con Pollo" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700" for="meal-desc">Descripción (opcional)</label>
<textarea class="w-full border-slate-200 rounded-xl p-4 focus:ring-brand-orange focus:border-brand-orange transition-all placeholder:text-slate-400" id="meal-desc" placeholder="Añade detalles sobre la preparación o ingredientes..." rows="4"></textarea>
</div>
</section>
<!-- Meal Type Selection -->
<section class="space-y-4" data-purpose="meal-type-selection">
<h3 class="text-sm font-semibold text-slate-700">Tipo de comida *</h3>
<div class="flex flex-wrap gap-2">
<!-- Active Chip -->
<button class="px-4 py-2 rounded-full border border-brand-orange bg-brand-lightOrange text-brand-orange text-sm font-medium flex items-center gap-2">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
            Desayuno
          </button>
<!-- Inactive Chips -->
<button class="px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
            Almuerzo
          </button>
<button class="px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
            Cena
          </button>
<button class="px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
            Snack
          </button>
<button class="px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
            Postre
          </button>
</div>
</section>
</main>
<!-- END: FormContent -->
<!-- BEGIN: StickyFooter -->
<footer class="p-6 bg-white border-t border-slate-100" data-purpose="navigation-footer">
<button class="w-full bg-brand-orange hover:bg-[#e67600] text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-orange-200 transition-all flex items-center justify-center gap-2 active:scale-[0.98]" onclick="void(0)" type="button">
        SIGUIENTE
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: StickyFooter -->
</div>
<script data-purpose="interaction-logic">
    // Minimal interaction logic for UI feedback
    document.querySelectorAll('[data-purpose="meal-type-selection"] button').forEach(button => {
      button.addEventListener('click', function() {
        // Reset all buttons in this section
        document.querySelectorAll('[data-purpose="meal-type-selection"] button').forEach(btn => {
          btn.className = "px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors";
          const icon = btn.querySelector('svg');
          if(icon) icon.remove();
        });
        
        // Style selected button
        this.className = "px-4 py-2 rounded-full border border-brand-orange bg-brand-lightOrange text-brand-orange text-sm font-medium flex items-center gap-2";
        this.insertAdjacentHTML('afterbegin', `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`);
      });
    });
  </script>
</body></html>
