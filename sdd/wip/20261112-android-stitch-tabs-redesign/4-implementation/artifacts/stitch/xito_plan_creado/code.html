<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoodLife - Plan de Comidas Exitoso</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-typography">
    /* Using system fonts to match iOS/Material feel */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style data-purpose="animations">
    @keyframes scaleIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-scale-in {
      animation: scaleIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
<!-- BEGIN: SuccessScreenContent -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center" data-purpose="success-message-container">
<!-- Success Illustration Container -->
<div class="mb-8 animate-scale-in" data-purpose="illustration-wrapper">
<div class="w-32 h-32 bg-green-50 rounded-full flex items-center justify-center mx-auto border-4 border-green-100">
<!-- SVG Checkmark Icon -->
<svg class="h-16 w-16 text-green-500" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Title and Description -->
<div class="space-y-3" data-purpose="success-text-content">
<h1 class="text-3xl font-bold text-green-600 tracking-tight">
        ¡Plan de comidas creado!
      </h1>
<p class="text-gray-500 text-lg max-w-[280px] mx-auto leading-relaxed">
        Aparecerá en tu Daily a partir de mañana
      </p>
</div>
</main>
<!-- END: SuccessScreenContent -->
<!-- BEGIN: BottomAction -->
<footer class="p-6 pb-12" data-purpose="bottom-navigation">
<!-- Material 3 Style Button: Full width, rounded-full, high emphasis -->
<button class="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-semibold py-4 rounded-full transition-colors duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 uppercase tracking-wide text-sm" data-purpose="dismiss-button" id="btn-understand">
      Entendido
    </button>
</footer>
<!-- END: BottomAction -->
<!-- BEGIN: InteractionLogic -->
<script data-purpose="event-handlers">
    document.getElementById('btn-understand').addEventListener('click', function() {
      // Logic for dismissing the screen or navigating back to Daily
      console.log('Success screen dismissed');
    });
  </script>
<!-- END: InteractionLogic -->
</body></html>
